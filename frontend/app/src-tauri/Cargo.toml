[package]
name = "autoagent"
version = "0.1.0"
description = "AutoAgent: a small island at the top of the screen that watches your coding agents"
edition = "2021"
publish = false

[lib]
name = "autoagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: the island window is transparent on macOS too.
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
