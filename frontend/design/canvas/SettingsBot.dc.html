<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings: Your bot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Instrument+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#555a75;text-decoration:none}a:hover{color:#14152a}
</style>
</helmet>
<div style="width: 100%; min-height: 760px; box-sizing: border-box; background: #fff; color: #14152a; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-wrap: wrap">
  <nav aria-label="Settings sections" style="flex: 1 1 220px; max-width: 260px; min-width: 0; box-sizing: border-box; padding: 20px 14px; background: #f5f6fa; border-right: 1px solid #e4e6ef; display: flex; flex-direction: column; gap: 2px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px"><svg width="28" height="31" viewBox="0 0 100 110" aria-hidden="true"><circle cx="50" cy="11" r="8" fill="#14152a"/><rect x="46" y="14" width="8" height="10" fill="#14152a"/><rect x="8" y="22" width="84" height="52" rx="24" fill="#14152a"/><rect x="21" y="33" width="58" height="31" rx="14" fill="#f5f6fa"/><rect x="32" y="41" width="13" height="10" rx="4" fill="#14152a"/><rect x="55" y="41" width="13" height="10" rx="4" fill="#14152a"/><rect x="43" y="80" width="14" height="26" rx="7" fill="#14152a"/><rect x="21" y="78" width="11" height="20" rx="5.5" fill="#14152a" transform="rotate(38 26.5 88)"/><rect x="68" y="78" width="11" height="20" rx="5.5" fill="#14152a" transform="rotate(-38 73.5 88)"/></svg><span style="font-family: Poppins, sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -0.4px">autoagent</span></div>
    <a href="SettingsGeneral.dc.html" style="height: 40px; padding: 0 12px; border-radius: 10px; font-size: 14.5px; display: flex; align-items: center">General</a>
    <a href="SettingsAgents.dc.html" style="height: 40px; padding: 0 12px; border-radius: 10px; font-size: 14.5px; display: flex; align-items: center">Agents</a>
    <a href="SettingsBot.dc.html" aria-current="page" style="height: 40px; padding: 0 12px; border-radius: 10px; background: #fff; color: #14152a; font-weight: 700; font-size: 14.5px; display: flex; align-items: center; box-shadow: 0 0 0 1px #e4e6ef">Your bot</a>
    <a href="SettingsAccount.dc.html" style="height: 40px; padding: 0 12px; border-radius: 10px; font-size: 14.5px; display: flex; align-items: center">Account &amp; chat</a>
    <a href="#" style="height: 40px; padding: 0 12px; border-radius: 10px; font-size: 14.5px; display: flex; align-items: center">Updates</a>
    <a href="#" style="height: 40px; padding: 0 12px; border-radius: 10px; font-size: 14.5px; display: flex; align-items: center">About</a>
  </nav>
  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 40px; display: flex; flex-direction: column; gap: 22px; max-width: 920px">
    <div style="display: flex; flex-direction: column; gap: 4px"><h1 style="margin: 0; font-family: Poppins, sans-serif; font-size: 26px; letter-spacing: -0.6px">Your bot</h1><p style="margin: 0; font-size: 15px; color: #555a75">Dress it up. The island, the tray and every card use it.</p></div>
    <div style="display: flex; gap: 28px; flex-wrap: wrap">
      <div style="flex: 0 0 220px; display: flex; flex-direction: column; gap: 12px">
        <div style="width: 220px; height: 220px; border-radius: 48px; background: {{previewCol}}; display: flex; align-items: center; justify-content: center">
          <svg width="150" height="165" viewBox="0 0 100 110" aria-hidden="true"><path d="M28 22 L50 -6 L72 22 Z" fill="#ff6fa5"/><circle cx="50" cy="-6" r="5" fill="#ffd23f"/><rect x="8" y="22" width="84" height="52" rx="24" fill="#fff"/><rect x="21" y="33" width="58" height="31" rx="14" fill="{{previewCol}}"/><rect x="32" y="41" width="13" height="10" rx="4" fill="#fff"/><rect x="55" y="41" width="13" height="10" rx="4" fill="#fff"/><ellipse cx="14" cy="58" rx="5" ry="3" fill="#ff6fa5"/><ellipse cx="86" cy="58" rx="5" ry="3" fill="#ff6fa5"/><rect x="43" y="80" width="14" height="26" rx="7" fill="#fff"/><rect x="21" y="78" width="11" height="20" rx="5.5" fill="#fff" transform="rotate(38 26.5 88)"/><rect x="68" y="78" width="11" height="20" rx="5.5" fill="#fff" transform="rotate(-38 73.5 88)"/></svg>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px" role="group" aria-label="Preview a state">
          <sc-for list="{{states}}" as="s" hint-placeholder-count="8"><button aria-label="{{s.name}}" aria-pressed="{{s.on}}" onClick="{{s.pick}}" style="width: 30px; height: 30px; border-radius: 10px; border: 0; background: {{s.col}}; box-shadow: {{s.ring}}"></button></sc-for>
        </div>
        <span style="font-size: 13.5px; color: #555a75">Previewing: <b style="color: #14152a">{{previewName}}</b></span>
      </div>
      <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
        <span style="font-family: Poppins, sans-serif; font-weight: 700; font-size: 15px">Face item</span>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{faces}}" as="f" hint-placeholder-count="7"><button style="height: 44px; border-radius: 12px; border: 1px solid #e4e6ef; background: #fff; font: 14px 'Instrument Sans', sans-serif; color: #14152a; box-shadow: {{f.ring}}">{{f.name}}</button></sc-for>
        </div>
        <span style="font-family: Poppins, sans-serif; font-weight: 700; font-size: 15px; margin-top: 10px">Outfit</span>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{outfits}}" as="o" hint-placeholder-count="9"><button style="height: 44px; border-radius: 12px; border: 1px solid #e4e6ef; background: #fff; font: 14px 'Instrument Sans', sans-serif; color: #14152a; box-shadow: {{o.ring}}">{{o.name}}</button></sc-for>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const ring = (on) => (on ? '0 0 0 2px #fff, 0 0 0 4px #14152a' : 'none');
    const sel = (this.state && this.state.picked) || 'Idle';
    const list = [['Idle', '#1af1d6'], ['Working', '#4c8dff'], ['Needs you', '#ffb020'], ['Success', '#2fd27a'], ['Error', '#ff5a5f'], ['Sleeping', '#8a5cff'], ['Chatting', '#ff6fa5'], ['Offline', '#9aa3b5']];
    const cur = list.find((x) => x[0] === sel) || list[0];
    return {
      previewCol: cur[1], previewName: cur[0],
      states: list.map(([name, col]) => ({ name, col, on: String(name === sel), ring: ring(name === sel), pick: () => this.setState({ picked: name }) })),
      faces: ['None', 'Glasses', 'Shades', 'Blush', 'Heart eyes', 'Star eyes', 'Moustache'].map((name) => ({ name, ring: name === 'Blush' ? '0 0 0 2px #14152a' : 'none' })),
      outfits: ['None', 'Party hat', 'Beanie', 'Crown', 'Wizard', 'Bow', 'Headphones', 'Bow tie', 'Scarf'].map((name) => ({ name, ring: name === 'Party hat' ? '0 0 0 2px #14152a' : 'none' })),
    };
  }
}
</script>
</body>
</html>
